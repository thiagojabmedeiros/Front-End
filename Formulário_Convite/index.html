<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Formulário_Convite/styles/index.css">

    <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <title>Convite</title>
</head>
<body>
    <div id="app">
        <aside class="aside-container">
            <img src="..\Formulário_Convite\assets\Logo.svg" style="width: 48.5px; height: 48px;">
            <h1>Festivite</h1>
            <p>Crie um convite digital para o seu evento</p>
        </aside>

        <main class="main-container">
            <h1>Crie seu convite</h1>

            <form enctype="multipart/form-data" method="post">
                <fieldset class="form-info">

                    <div class="fototexto"> 
                        <img src="..\Formulário_Convite\assets\icones\calendar.svg" alt="icone" style="width: 24px; height: 24px;">
                        <h2>Sobre o evento</h2>
                    </div>

                    <div class="input-wrapper">
                        <p><label for="titulo">Título</label></p>
                        <input id="titulo" name="titulo" type="text" placeholder="Nome do Evento" required>
                    </div>
                    
                    <div class="input-date">
                        <div>
                            <p><label for="inicio">Início</label></p>
                            <input id="inicio" type="date" required>
                        </div>

                        <div>
                            <p><label for="fim">Fim</label></p>
                            <input id="fim" type="date" required>
                        </div>
                    </div>

                    <div class="input">
                        <div>
                            <label for="tipo"><p>Tipo</p></label>
                                <div id="tipo">
                                    <input id="presencial" type="radio" name="tipo" value="presencial" required>
                                    <label for="presencial">Presencial</label>
                                    <input id="on-line" type="radio" name="tipo" value="on-line" required>
                                    <label for="on-line">On-line</label>
                                </div>
                        </div>

                        <div>
                            <p><label for="local">Local</label></p>
                            <input id="local" name="local" type="text"  placeholder="Link ou endereço" required>
                        </div>
                    </div>

                    <div class="textarea-wrapper">
                        <p><label for="descricao">Descrição</label></p>
                        <hr style="border: none;">
                        <textarea id="descricao" name="descricao" type="text" placeholder="Escreva os detalhes sobre o evento" required></textarea>
                    </div>

                    <div class="fototexto"> 
                        <img src="..\Formulário_Convite\assets\icones\paintbrush-vertical.svg" alt="icone" style="width: 24px; height: 24px;">
                        <h2>Personalização</h2>
                    </div>

                    <div class="input-cores">
                        <p style="margin-bottom: 16px;"><label for="cores">Cor principal</label></p>
                        
                        <div id="cores" style="width: 560px; height: 40px;">
                            
                            <input id="azulclaro" type="radio" name="cores" value="azulclaro" style="margin-left: 20px;">
                            <label for="azulclaro"><div style="background-color: var(--brand-light);"></div></label>
                            
                            <input id="roxoescuro" type="radio" name="cores" value="roxoescuro">
                            <label for="roxoescuro"><div style="background-color: var(--purple);"></div></label>
                            
                            <input id="roxo" type="radio" name="cores" value="roxo">
                            <label for="roxo"><div style="background-color: var(--fuschia);"></div></label>
                            
                            <input id="rosa" type="radio" name="cores" value="rosa">
                            <label for="rosa"><div style="background-color: var(--pink);"></div></label>
                            
                            <input id="laranja" type="radio" name="cores" value="laranja">
                            <label for="laranja"><div style="background-color: var(--orange);"></div></label>
                            
                            <input id="amarelo" type="radio" name="cores" value="amarelo">
                            <label for="amarelo"><div style="background-color: var(--yellow);"></div></label>
                            
                            <input id="limao" type="radio" name="cores" value="limao">
                            <label for="limao"><div style="background-color: var(--lime);"></div></label>
                            
                            <input id="verde" type="radio" name="cores" value="verde">
                            <label for="verde"><div style="background-color: var(--green);"></div></label>
                            
                            <input id="ciano" type="radio" name="cores" value="ciano">
                            <label for="ciano"><div style="background-color: var(--cyan);"></div></label>

                            <input id="navy" type="radio" name="cores" value="navy">
                            <label for="navy"><div style="background-color: var(--navy);"></div></label>

                        </div>
                    </div>

                    <div class="input-tema">
                        <p style="margin-bottom: 16px;"><label for="tema">Tema do evento</label></p>

                        <div class="tema">
                            <input id="aniversario" type="radio" name="tema" value="aniversario">
                            <label for="aniversario"><img src="..\Formulário_Convite\assets\thumbnail\Image.svg"><p>Aniversário</p></label>
                            
                            <input id="infantil" type="radio" name="tema" value="infantil">
                            <label for="infantil"><img src="..\Formulário_Convite\assets\thumbnail\Image (1).svg"><p>Infantil</p></label>

                            <input id="formatura" type="radio" name="tema" value="formatura">
                            <label for="formatura"><img src="..\Formulário_Convite\assets\thumbnail\Image (2).svg"><p>Formatura</p></label>

                            <input id="casamento" type="radio" name="tema" value="casamento">
                            <label for="casamento"><img src="..\Formulário_Convite\assets\thumbnail\Image (3).svg"><p>Casamento</p></label>
                        </div>

                        <div class="tema">
                            <input id="chadebebe" type="radio" name="tema" value="cha de bebe">
                            <label for="chadebebe"><img src="..\Formulário_Convite\assets\thumbnail\Image (4).svg"><p>Chá de bebê</p></label>
                            
                            <input id="chadepanela" type="radio" name="tema" value="cha de panela">
                            <label for="chadepanela"><img src="..\Formulário_Convite\assets\thumbnail\Image (5).svg"><p>Chá de panela</p></label>

                            <input id="carnaval" type="radio" name="tema" value="carnaval">
                            <label for="carnaval"><img src="..\Formulário_Convite\assets\thumbnail\Image (6).svg"><p>Carnaval</p></label>

                            <input id="pascoa" type="radio" name="tema" value="pascoa">
                            <label for="pascoa"><img src="..\Formulário_Convite\assets\thumbnail\Image (7).svg"><p>Páscoa</p></label>
                        </div>
                        <div class="tema">
                            <input id="saojoao" type="radio" name="tema" value="sao joao">
                            <label for="saojoao"><img src="..\Formulário_Convite\assets\thumbnail\Image (8).svg"><p>São João</p></label>
                            
                            <input id="Halloween" type="radio" name="tema" value="Halloween">
                            <label for="Halloween"><img src="..\Formulário_Convite\assets\thumbnail\Image (9).svg"><p>Halloween</p></label>

                            <input id="Natal" type="radio" name="tema" value="Natal">
                            <label for="Natal"><img src="..\Formulário_Convite\assets\thumbnail\Image (10).svg"><p>Natal</p></label>

                            <input id="outro" type="radio" name="tema" value="outro">
                            <label for="outro"><img src="..\Formulário_Convite\assets\thumbnail\Image (11).svg"><p>Outro</p></label>
                        </div>
                    </div>

                    <div class="drop-area">
                        <div>
                            <p><label for="tom">Estilo</label></p>
                            <input id="presencial" type="radio" name="tipo" value="presencial" required>
                            <input id="on-line" type="radio" name="tipo" value="on-line" required>
                            <label for="on-line">Escuro</label>
                        </div>
                        
                        <div>
                            <p><label for="capa">Foto de capa</label></p>
                            <div>
                                <img src="..\Formulário_Convite\assets\icones\upload.svg" style="width: 16px; height: 16px;">
                                <input type="file" id="capa" name="foto" placeholder="Selecionar">
                            </div>
                        </div>
                    </div>

                    <div class="fototexto"> 
                        <img src="..\Formulário_Convite\assets\icones\contact.svg" alt="icone" style="width: 24px; height: 24px;">
                        <h2>Dados para contato</h2>
                    </div>

                    <div class="input-wrapper">
                        <p><label for="nome">Nome</label></p>
                        <input id="nome" name="nome" type="text" placeholder="Nome completo" required>

                        <div class="error">
                            <img src="..\Formulário_Convite\assets\icones\circle-alert.svg">
                            <p>Campo obrigatório</p> 
                        </div>                        
                    </div>

                    <div class="input-dados">
                        <div>
                            <p><label for="email">E-mail</label></p>
                            <input id="email" name="email" type="text" placeholder="exemplo@email.com" required>

                            <div class="error">
                                <img src="..\Formulário_Convite\assets\icones\circle-alert.svg">
                                <p>Campo obrigatório</p> 
                            </div>
                        </div>

                        <div>
                            <p><label for="telefone">Telefone</label></p>
                            <input id="telefone" name="telefone" type="text" placeholder="(99) 9 9999-9999" required>

                            <div class="error">
                                <img src="..\Formulário_Convite\assets\icones\circle-alert.svg">
                                <p>Campo obrigatório</p> 
                            </div>
                        </div>
                        


                    </div>
                    
                    <hr style="margin-block: 48px; border: none;">

                    <div class="select-input">
                        <input id="termos" type="checkbox" required>
                        <label for="termos">Li e concordo com os <a href="#" style="color: var(--brand-dark); font: var(--body-sm);">Termos e Condições</a> e com a <a href="#" style="color: var(--brand-dark); font: var(--body-sm);">Política de Privacidade</a></label>
                        <hr style="border: none;">
                        <input id="promoemail" type="checkbox">
                        <label for="promoemail">Aceito receber atualizações e promoções por e-mail</label>
                        <hr style="border: none;">
                        <input id="promosms" type="checkbox">
                        <label for="promosms">Aceito receber atualizações e promoções por SMS</label>                       
                    </div>

                    <div class="botao">
                        <button type="submit"><img src="..\Formulário_Convite\assets\icones\ticket.svg" style="width: 20px; height: 20px;">Gerar convite</button>
                    </div>

                </fieldset>
            </form>

        </main>
    </div>
</body>
</html>
