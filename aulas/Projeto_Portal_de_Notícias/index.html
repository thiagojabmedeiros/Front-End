<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!--Fontes-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Notícias</title>
    <link rel="stylesheet" href="..\Projeto_Portal_de_Notícias\style\index.css">

    <!--Fontes-->
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Archivo:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="container">
        <nav id="primary" class="grid grid-col">
            <div>
                <img src="..\Projeto_Portal_de_Notícias\assets\icons\List.svg">
                <strong>Menu</strong>
            </div>
            <div>
                <strong style="color: var(--brand-color-light);" alt="Logo tech news">TECH NEWS</strong>
            </div>
            <div>
                Buscar
                <img src="..\Projeto_Portal_de_Notícias\assets\icons\MagnifyingGlass.svg" alt="Lupa de pesquisa">
            </div>
        </nav>
        <nav id="secondary" class="grid grid-col">
            <a href="#">Inteligência Artificial</a>
            <a href="#">Blockchain</a>
            <a href="#">Hologramas</a>
            <a href="#">Internet</a>
            <a href="#">Vestíveis</a>
            <a href="#">Realidade Aumentada</a>
            <a href="#">Realidade Virtual</a>
        </nav>
    </header>

    <main class="grid container ">
        <section id="featured" class="grid grid-cols-2 gap">

            <figure class="card">
                <img src="..\Projeto_Portal_de_Notícias\assets\images\Image 01.png" alt="...">
                <figcaption>
                    <span class="content-tag">Robótica</span>
                    <h2 class="text-2xl">Robôs domésticos começam a ser adotados para tarefas diárias, prometendo mais conforto e eficiência nas residências.</h2>
                </figcaption>
            </figure>
            
            <div class="grid grid-cols-2 gap">

            <div class="card">
                <figure >
                <img src="..\Projeto_Portal_de_Notícias\assets\images\Image 02.png" alt="...">
                <figcaption>
                    <span class="content-tag">Hologramas</span>
                        <h3 class="text-sm">Novo Smartphone Projetor 3D chega ao mercado, transformando a forma como vemos nossas telas!</h3>
                </figcaption>
                </figure>
            </div>

            <div class="card">
                <figure >
                <img src="..\Projeto_Portal_de_Notícias\assets\images\Image 03.png" alt="...">
                <figcaption>
                    <span class="content-tag">Internet</span>
                    <h3 class="text-sm">Tecnologia 6G chega às metrópoles brasileiras, prometendo revolucionar a forma como vivemos e nos comunicamos.</h3>
                    </figcaption>
                </figure>
            </div>
            <div class="card">
                <figure>
                <img src="..\Projeto_Portal_de_Notícias\assets\images\Image 04.png" alt="...">
                <figcaption>
                    <span class="content-tag">Vestíveis</span>
                    <h3 class="text-sm">Empresa lança relógio inteligente capaz de monitorar a saúde mental, oferecendo insights valiosos para o bem-estar pessoal.</h3>
                </figcaption>
                </figure>

            </div>
            <div class="card">
                <figure>
                <img src="..\Projeto_Portal_de_Notícias\assets\images\Image 05.png" alt="...">
                <figcaption>
                    <span class="content-tag">Realidade Virtual</span>
                    <h3 class="text-sm">Escolas adotam a tecnologia VR para proporcionar experiências imersivas, transformando a aprendizagem tradicional.</h3>
                </figcaption>
                </figure>
            </div>
            </div>


        </section>
    </main>

    <section id="weekly" class="container">
        <header id="maislidas" class="grid grid-cols-2"> 
            <h3>Mais lidas da semana</h3>
            <a href="#"><strong>Ver tudo</strong></a>   
        </header>

        <div id="maislidas" class="grid gap">
            <div>
                <figure class="grid gap">
                    <figcaption>
                        <img src="..\Projeto_Portal_de_Notícias\assets\images\Image 06.png">
                        <span class="content-tag">Veículos</span>
                    </figcaption>
                    <p>Protótipo de veículo voador é apresentado, marcando o início da era dos transportes aéreos pessoais.</p>
                </figure>
            </div>
            <div>
                <figure class="grid gap">
                    <figcaption>
                        <img src="..\Projeto_Portal_de_Notícias\assets\images\Image 07.png">
                        <span class="content-tag">Hologramas</span>
                    </figcaption>
                    <p>Plataforma de videoconferência apresenta nova função de hologramas, tornando as chamadas virtuais mais realistas e envolventes.</p>
                </figure>
            </div>
            <div>
                <figure class="grid gap">
                    <figcaption>
                        <img src="..\Projeto_Portal_de_Notícias\assets\images\Image 08.png">
                        <span class="content-tag">Realidade Virtual</span>
                    </figcaption>    
                    <p>Nova geração de consoles de videogame é lançada, trazendo gráficos ultra-realistas e experiências de jogo totalmente envolventes.</p>
                </figure>
            </div>
            <div>
                <figure class="grid gap">
                    <figcaption>
                        <img src="..\Projeto_Portal_de_Notícias\assets\images\Image 09.png">
                        <span class="content-tag">Internet</span>
                    </figcaption>
                    <p>Projeto busca oferecer internet de alta velocidade em áreas remotas através de satélites.</p>
                </figure>
            </div>
        </div>
</body>

</html>
